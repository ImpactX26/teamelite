nt-weight:800}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:17px}.card{background:#fff;border:1px solid #e4e8f0;border-radius:15px;padding:19px}.card h3{font-size:13px;margin:0 0 13px}.card h4{font-size:11px;margin:18px 0 8px}.choice{border:1px solid #e1e5ed;background:#fafbfe;border-radius:10px;padding:12px;text-align:left;cursor:pointer;font-size:11px}.choice.selected{border-color:#715eea;background:#f0eeff;color:#5141c5;font-weight:800}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.select,input,textarea{width:100%;border:1px solid #dfe4ed;border-radius:9px;padding:9px 10px;background:#fff;font-size:11px}.form{display:grid;grid-template-columns:1fr 1fr;gap:11px}.field label{display:block;font-size:10px;color:#7b8599;margin-bottom:6px}.field.full{grid-column:1/-1}.tags span{display:inline-block;padding:6px 9px;background:#efedff;color:#5e4bd3;border-radius:20px;font-size:10px;margin:3px}.upload{border:1px dashed #bcc6d8;border-radius:15px;background:#fbfcff;padding:22px;text-align:center}.upload b{display:block;margin:7px}.upload small{color:#8993a7}.docs{margin-top:15px}.doc{background:#fff;border:1px solid #e4e8f0;border-radius:12px;padding:12px;display:flex;align-items:center;gap:10px;margin-bottom:8px}.docText{flex:1}.docText b,.docText span{display:block}.docText b{font-size:11px}.docText span{font-size:9px;color:#8992a5;margin-top:3px}.status{display:inline-flex;align-items:center;gap:6px;font-size:9px;padding:6px 8px;border-radius:15px;font-weight:800}.verified{color:#218d69;background:#ecfaf5}.ai{color:#5e4bd3;background:#efedff}.applicant{color:#8b6200;background:#fff7e5}.blocked{color:#a43c3c;background:#fdecec}.info{color:#376a9a;background:#edf6ff}.warn{color:#a06b00;background:#fff7e5;padding:6px 8px;border-radius:15px;font-size:9px;font-weight:800}.ok{font-size:9px;color:#218d69;background:#ecfaf5;padding:6px 8px;border-radius:15px;font-weight:800}.video{display:grid;grid-template-columns:1.15fr .85fr;gap:16px}.preview{min-height:300px;background:linear-gradient(145deg,#11182b,#263354);color:#fff;border-radius:15px;display:grid;place-items:center;text-align:center;padding:25px}.insights{background:#fff;border:1px solid #e4e8f0;border-radius:15px;padding:18px}.insight{padding:11px 0;border-bottom:1px solid #edf0f4}.insight small,.insight b{display:block}.insight small{color:#8992a5}.insight b{font-size:11px;margin-top:4px}.qual{display:grid;grid-template-columns:1.42fr .78fr;gap:16px}.ruleRow{padding:12px 0;border-top:1px solid #edf0f4;display:flex;justify-content:space-between;gap:12px;align-items:center}.ruleRow:first-child{border-top:0}.ruleText{flex:1}.ruleText b,.ruleText span{display:block}.ruleText b{font-size:11px}.ruleText span{font-size:9px;color:#8992a5;margin-top:3px;line-height:1.4}.score{text-align:center;display:grid;place-items:center}.scoreCircle{width:115px;height:115px;border-radius:50%;border:9px solid #e8e5ff;display:grid;place-items:center;color:#5e4bd3;font-size:27px;font-weight:900}.metric{font-size:9px;color:#7f899e;margin-top:6px}.route{background:linear-gradient(120deg,#171d34,#2b3c67);color:#fff;border-radius:16px;padding:25px}.route h2{margin:7px 0;font-size:21px}.route p{color:#b9c2d3;font-size:11px;line-height:1.5}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:15px}.action{background:#fff;border:1px solid #e4e8f0;border-radius:13px;padding:16px}.action b{font-size:11px}.action p{font-size:10px;color:#818ba0;line-height:1.45}.route2{background:#fff;border:1px solid #e4e8f0;border-radius:13px;padding:15px;margin-top:15px}.emailBox{background:#f8f9fd;border:1px solid #e5e8f0;border-radius:12px;padding:14px;font-size:10px;line-height:1.55}.company{border:1px solid #e4e8f0;border-radius:12px;padding:14px;background:#fff;margin-bottom:10px}.companyTop{display:flex;justify-content:space-between;gap:10px}.companyTop b{font-size:11px}.muted{color:#8791a4;font-size:9px}.progress{height:8px;background:#edf0f5;border-radius:10px;overflow:hidden}.progress span{display:block;height:100%;background:#6352df;border-radius:10px}.bottom{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:18px;color:#788398;font-size:10px}.primary{background:#6352df;color:#fff;border:0;border-radius:9px;padding:10px 15px;cursor:pointer;font-size:11px;font-weight:800}.secondary{background:#fff;color:#5243b8;border:1px solid #dcd8f7;border-radius:9px;padding:9px 13px;cursor:pointer;font-size:11px;font-weight:800}.checkline{display:flex;gap:8px;align-items:flex-start;font-size:10px;color:#5d6678;margin:8px 0}.checkline input{width:auto;margin-top:2px}.miniGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.miniStat{background:#f8f9fd;border:1px solid #e6e9ef;border-radius:11px;padding:11px}.miniStat b{display:block;font-size:15px}.miniStat span{font-size:9px;color:#8992a5}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:9px;border-bottom:1px solid #edf0f4;font-size:10px;vertical-align:top}.table th{color:#7e889b;font-weight:800}.source{font-size:9px;color:#6d55cf;background:#f1efff;padding:5px 7px;border-radius:12px;display:inline-block}.timeline{display:flex;gap:10px;align-items:center;overflow:auto;padding:4px 0 8px}.step{min-width:140px;border:1px solid #e3e7ef;border-radius:12px;padding:10px;background:#fff}.step.active{border-color:#bfb6f3;background:#f7f5ff}.step b{font-size:10px}.step span{display:block;font-size:9px;color:#8992a5;margin-top:3px}@media(max-width:900px){.side{display:none}.grid,.video,.qual,.actions{grid-template-columns:1fr}.choices,.miniGrid{grid-template-columns:1fr}.content{padding:20px}.hero{padding:22px}.ring{display:none}.form{grid-template-columns:1fr}}
</style></head>
<body><div class="app">
<aside class="side"><div class="logo"><div class="mark">✦</div><div><b>EduGuide AI</b><small>Applicant Journey</small></div></div><div class="label">JOURNEY</div>
<button class="nav active" onclick="show('journey')">⌂ &nbsp; Journey</button><button class="nav" onclick="show('profile')">◉ &nbsp; Profile Builder</button><button class="nav" onclick="show('documents')">▣ &nbsp; Evidence & Documents</button><button class="nav" onclick="show('video')">◉ &nbsp; Introduction Video</button><button class="nav" onclick="show('qualification')">✓ &nbsp; Qualification</button><button class="nav" onclick="show('next')">➜ &nbsp; Next Step</button><button class="nav" onclick="show('resume')">▤ &nbsp; Verified Resume</button><button class="nav" onclick="show('outreach')">✉ &nbsp; Educaro Outreach</button><button class="nav" onclick="show('interviews')">◷ &nbsp; Interviews</button>
<div class="agent"><div class="online">● AGENT ONLINE</div><b>Journey Agent</b><p>Evidence-first routing. Qualification rules are visible and every conclusion has a source or a gap.</p></div></aside>
<main><header class="top"><div><div class="eyebrow">EVIDENCE-FIRST APPLICANT JOURNEY · GERMANY ONLY</div><h1 id="title">Your international career journey</h1></div><div class="avatar">AS</div></header><section class="content" id="content"></section></main></div>
<script>
const countries=["Germany"];
let goal="Employment",country="Germany",current="journey";
let videoReady=false,videoUploaded=false,docsAnalyzed=false,resumeReady=false,outreachSent=false,educaroForwarded=false,interviewOffer=false,applicantNotified=false;
let qualificationRun=false,qualified=false,qualificationStatus="BLOCKED";
let employmentDatesConfirmed=false,languageEvidenceVerified=false,languageRequirementChecked=false,recognitionConfirmed=false,programFitConfirmed=false,trainingOfferConfirmed=false;
let uploadedDocs=[];
let extras={courses:[],internships:[],projects:[],certifications:[],awards:[],volunteering:[],languages:["English — C1","German — B1"]};
const coreDocs=[
{name:"Degree / diploma",type:"Education",status:"verified",fact:"B.E. Computer Science · 2025",mandatory:["Study","Vocational Training","Employment"]},
{name:"Transcript / mark sheets",type:"Education",status:"verified",fact:"Academic record available",mandatory:["Study"]},
{name:"Experience letter",type:"Employment",status:"verified",fact:"Software Engineer · 1.5 years",mandatory:["Employment","Vocational Training"]},
{name:"German B1 Certificate",type:"Language",status:"review",fact:"Language evidence needs confirmation",mandatory:["Vocational Training"]},
{name:"CV",type:"Profile",status:"verified",fact:"React · TypeScript · Node.js",mandatory:[]},
{name:"Introduction video",type:"Media",status:"review",fact:"Background, motivation and career goals",mandatory:[]}
];
const standards={
  "Study":[
    {id:"study-entry",label:"University entrance qualification is evidenced",detail:"A recognised university entrance qualification or the configured admission route must be supported by evidence.",source:"Germany study requirements",state:()=>programFitConfirmed},
    {id:"study-program",label:"Study programme fit is captured",detail:"Target programme / subject and its admission language are recorded for the next admission check.",source:"Applicant-provided + programme check",state:()=>programFitConfirmed},
    {id:"study-docs",label:"Education documents are complete",detail:"Degree/school records and transcript or equivalent supporting evidence are present.",source:"Evidence completeness",state:()=>hasDoc("Degree / diploma")&&hasDoc("Transcript / mark sheets")}
  ],
  "Vocational Training":[
    {id:"vet-b1",label:"German language evidence is at least B1",detail:"For vocational-training visa purposes, German is usually required at B1; programme/employer requirements can be higher.",source:"Make it in Germany",state:()=>languageEvidenceVerified},
    {id:"vet-school",label:"School-leaving / education evidence is present",detail:"For school-based training, the school-leaving certificate may need recognition; the exact occupation can add requirements.",source:"Make it in Germany",state:()=>hasDoc("Degree / diploma")},
    {id:"vet-training",label:"Training target is defined",detail:"Profession / Ausbildung target should be clear before matching to a training place.",source:"Pathway readiness",state:()=>trainingOfferConfirmed},
    {id:"vet-consistency",label:"Core documents have no date conflict",detail:"Experience and education dates must agree across the profile and uploaded evidence.",source:"Evidence consistency",state:()=>employmentDatesConfirmed}
  ],
  "Employment":[
    {id:"emp-qualification",label:"Primary qualification is evidenced",detail:"Academic or vocational qualification supporting the intended occupation is present.",source:"Germany recognition framework",state:()=>hasDoc("Degree / diploma")},
    {id:"emp-role",label:"Role alignment is plausible",detail:"Education, experience, skills, projects and certifications are mapped to the target occupation.",source:"Profile-to-role match",state:()=>roleFitScore()>=60},
    {id:"emp-recognition",label:"Recognition / comparability route is addressed",detail:"Regulated professions need recognition/licensing; non-regulated routes may need comparability evidence depending on the purpose of stay.",source:"Make it in Germany",state:()=>recognitionConfirmed},
    {id:"emp-experience",label:"Relevant experience is evidenced",detail:"Experience, internships or equivalent evidence should be traceable to uploaded sources where claimed.",source:"Evidence-backed profile",state:()=>employmentDatesConfirmed && (hasDoc("Experience letter")||extras.internships.length>0)},
    {id:"emp-language",label:"Language requirement for the target role is checked",detail:"Language requirements depend on occupation and employer; the configured role check must be satisfied or explicitly marked not required.",source:"Occupation-specific requirement",state:()=>languageRequirementChecked}
  ]
};
function hasDoc(name){return coreDocs.some(d=>d.name===name && (d.status==="verified" || d.name==="Degree / diploma"));}
function interviewReadinessScore(){
  let s=0;
  if(videoReady)s+=15;
  if(coreDocs.some(d=>d.name==='Experience letter'&&d.status==='verified'))s+=20;
  if(extras.internships.some(x=>x.verified))s+=15;
  if(extras.projects.some(x=>x.verified))s+=15;
  if(extras.courses.some(x=>x.verified))s+=10;
  if(extras.certifications.some(x=>x.verified))s+=10;
  if(languageEvidenceVerified || languageRequirementChecked || goal==='Study' && programFitConfirmed)s+=10;
  if(uploadedDocs.length) s+=5;
  return Math.min(100,s);
}
function recoveryPlan(){
  if(goal==='Vocational Training' && !languageEvidenceVerified)return 'Language preparation: verify / obtain the German B1 certificate, then re-run qualification.';
  if(goal==='Vocational Training' && !trainingOfferConfirmed)return 'Training target: define the Ausbildung profession / route before company matching.';
  if(goal==='Study' && !programFitConfirmed)return 'Admission check: confirm the university-entrance qualification and programme/language fit.';
  if(goal==='Employment' && !recognitionConfirmed)return 'Recognition check: address the profession/visa-specific recognition or comparability route.';
  if(goal==='Employment' && !languageRequirementChecked)return 'Occupation check: confirm the target role language requirement and evidence / not-required status.';
  if(!employmentDatesConfirmed && goal!=='Study')return 'Evidence consistency: confirm employment / internship dates against supporting letters.';
  return 'Evidence completion: review every blocked rule above and re-run qualification.';
}
function roleFitScore(){
  let s=0;
  s+=25; // primary education already evidenced in the prototype
  s+=25; // verified core experience
  s+=20; // technical/professional skills captured in the profile
  s+=extras.courses.filter(x=>x.verified).length*3;
  s+=extras.certifications.filter(x=>x.verified).length*4;
  s+=extras.internships.filter(x=>x.verified).length*5;
  s+=extras.projects.filter(x=>x.verified).length*3;
  s+=extras.awards.filter(x=>x.verified).length*1;
  return Math.min(100,s);
}
function navNames(){return ["journey","profile","documents","video","qualification","next","resume","outreach","interviews"]}
const pages={journey,profile,documents,video,qualification,next,resume,outreach,interviews};
function show(p){current=p;document.querySelectorAll(".nav").forEach((x,i)=>x.classList.toggle("active",i===navNames().indexOf(p)));document.getElementById("title").textContent={journey:"Your international career journey",profile:"Profile Builder",documents:"Evidence & Documents",video:"Introduction Video",qualification:"Qualification Check",next:"Next Step",resume:"Verified Resume",outreach:"Educaro Outreach",interviews:"Interview Monitor"}[p]||"EduGuide AI";pages[p]();}
function field(label,value,full=false){return `<div class="field ${full?'full':''}"><label>${label}</label><input value="${value}" readonly></div>`}
function addExtra(kind,label,source){extras[kind].push({label,source,verified:false});renderExtras();}
function removeExtra(kind,i){extras[kind].splice(i,1);renderExtras();}
function verifyExtra(kind,i){extras[kind][i].verified=!extras[kind][i].verified;renderExtras();}
function extraRows(kind){return extras[kind].map((x,i)=>`<tr><td>${x.label}</td><td>${x.source||'Applicant-provided'}</td><td><span class="status ${x.verified?'verified':'applicant'}">${x.verified?'✓ Verified':'Applicant-provided'}</span></td><td><button class="secondary" onclick="verifyExtra('${kind}',${i})">${x.verified?'Unverify':'Verify'}</button> <button class="secondary" onclick="removeExtra('${kind}',${i})">Remove</button></td></tr>`).join('')||`<tr><td colspan="4" class="muted">None added yet. Add any relevant evidence below.</td></tr>`}
function renderExtras(){
  ["courses","internships","projects","certifications","awards","volunteering"].forEach(k=>{const el=document.getElementById("extra_"+k);if(el)el.innerHTML=extraRows(k)});
}
function journey(){document.getElementById("content").innerHTML=`<div class="hero"><div><span class="pill">✦ EVIDENCE-FIRST AI JOURNEY</span><h2>One profile. <span>Many pathways.</span></h2><p>Germany is the only destination. The agent collects education, employment, internships, courses, certifications, projects, languages, documents and video evidence before deciding the next action.</p></div><div class="ring">${qualified?100:qualificationRun?72:35}%</div></div><div class="grid"><div class="card"><h3>Choose the applicant goal</h3><div class="choices">${["Study","Vocational Training","Employment"].map(g=>`<button class="choice ${goal===g?'selected':''}" onclick="goal='${g}';qualificationRun=false;qualified=false;qualificationStatus='BLOCKED';show('journey')">${g}</button>`).join('')}</div><h4>Destination</h4><div class="choice selected">🇩🇪 Germany</div><div class="muted" style="margin-top:8px">Country selection is intentionally fixed to Germany for this journey.</div></div><div class="card"><h3>Current qualification state</h3><div class="miniGrid"><div class="miniStat"><b>${qualificationStatus}</b><span>Status</span></div><div class="miniStat"><b>${roleFitScore()}%</b><span>Evidence / role fit signal</span></div><div class="miniStat"><b>${coreDocs.filter(d=>d.status==='verified').length + uploadedDocs.length}</b><span>Evidence items</span></div></div><p style="font-size:11px;line-height:1.5;margin-top:12px">Extra courses, internships, projects and certifications strengthen role fit and the resume, but they do not replace mandatory pathway requirements.</p></div></div><div class="section"><h3>Journey controls</h3><p>Complete the profile, add every relevant document, then run the qualification check.</p><div class="caps"><button class="cap" onclick="show('profile')"><span class="num">01</span><span class="icon">◉</span><b>Build profile</b><p>Education, experience, languages and extra achievements.</p><span class="open">Open →</span></button><button class="cap" onclick="show('documents')"><span class="num">02</span><span class="icon">▣</span><b>Upload evidence</b><p>Courses, internships, project proof, certificates and core documents.</p><span class="open">Open →</span></button><button class="cap" onclick="show('video')"><span class="num">03</span><span class="icon">◉</span><b>Video insights</b><p>Background, motivation and career goals.</p><span class="open">Open →</span></button><button class="cap" onclick="show('qualification')"><span class="num">04</span><span class="icon">✓</span><b>Qualification</b><p>Pathway-specific gates with visible evidence and blockers.</p><span class="open">Open →</span></button><button class="cap" onclick="show('next')"><span class="num">05</span><span class="icon">➜</span><b>Next step</b><p>Only qualified applicants can proceed to the verified resume.</p><span class="open">Open →</span></button></div></div>`}
function profile(){document.getElementById("content").innerHTML=`<div class="pageTitle"><span class="pill">01 · PROFILE BUILDER</span><h2>Build one complete applicant profile.</h2><p>Keep applicant-provided facts separate from verified evidence and AI-generated summaries.</p></div><div class="grid"><div class="card"><h3>Applicant details</h3><div class="form">${field("Full name","Aarav Sharma")}${field("Current location","Bengaluru, India")}${field("Education","B.E. Computer Science")}${field("Graduation year","2025")}${field("Experience","1.5 years")}${field("Target country",country)}${field("Goal",goal)}${field("Availability","Open to Germany opportunities",false)}</div></div><div class="card"><h3>Skills & languages</h3><div class="tags"><span>React</span><span>TypeScript</span><span>Node.js</span><span>PostgreSQL</span><span>English — C1</span><span>German — B1</span></div><h4>Role alignment signal</h4><div class="miniGrid"><div class="miniStat"><b>${roleFitScore()}%</b><span>Current fit signal</span></div><div class="miniStat"><b>${extras.courses.length}</b><span>Extra courses</span></div><div class="miniStat"><b>${extras.internships.length}</b><span>Internships</span></div></div></div></div><div class="card" style="margin-top:16px"><h3>Extra applicant information</h3><table class="table"><thead><tr><th>Category</th><th>Examples captured</th><th>Why it matters</th></tr></thead><tbody><tr><td>Courses</td><td>Cloud, German, data, cybersecurity, project management</td><td>Supports skill depth and role alignment.</td></tr><tr><td>Internships</td><td>Company, role, dates, responsibilities</td><td>Can support practical experience when employment history is limited.</td></tr><tr><td>Projects</td><td>Portfolio, GitHub, academic or client projects</td><td>Shows applied skills and interview readiness.</td></tr><tr><td>Certifications</td><td>Vendor, professional or regulated credentials</td><td>May be required or strengthen a role match.</td></tr><tr><td>Achievements</td><td>Awards, publications, volunteering, leadership</td><td>Adds context without replacing mandatory evidence.</td></tr></tbody></table></div><div class="card" style="margin-top:16px"><h3>Language profile</h3><div class="form"><div class="field"><label>German evidence</label><select class="select"><option>B1 — certificate on file</option><option>A2 — needs improvement</option><option>B2 — certificate on file</option><option>C1 — certificate on file</option></select></div><div class="field"><label>English evidence</label><select class="select"><option>C1 — applicant-provided</option><option>B2 — applicant-provided</option><option>C2 — applicant-provided</option></select></div></div></div><div class="bottom"><span>Next: evidence intake</span><button class="primary" onclick="show('documents')">Continue →</button></div>`}
function documents(){document.getElementById("content").innerHTML=`<div class="pageTitle"><span class="pill">02 · EVIDENCE & DOCUMENTS</span><h2>Upload every relevant piece of evidence.</h2><p>Core documents plus extra courses, internships, projects, certificates and achievements can be attached to the profile.</p></div><div class="upload"><b>＋ Upload applicant documents</b><small>PDF, DOCX, JPG, PNG · degree · transcript · experience · language · course · internship · portfolio proof</small><br><input id="docInput" type="file" multiple accept=".pdf,.doc,.docx,.jpg,.jpeg,.png" style="margin:12px 0;font-size:10px"><br><button class="primary" onclick="captureDocs()">Add & analyze documents</button></div><div class="docs">${coreDocs.map(x=>`<div class="doc"><div style="font-size:20px">▣</div><div class="docText"><b>${x.name}</b><span>${x.type} · ${x.fact}</span></div><span class="status ${x.status==='verified'?'verified': 'applicant'}">${x.status==='verified'?'✓ Verified':'! Review'}</span></div>`).join('')}${uploadedDocs.map(x=>`<div class="doc"><div style="font-size:20px">▣</div><div class="docText"><b>${x}</b><span>Applicant upload · awaiting server-side extraction/verification</span></div><span class="status applicant">Uploaded</span></div>`).join('')}</div><div class="grid"><div class="card"><h3>Mandatory evidence by pathway</h3><div class="ruleRow"><div class="ruleText"><b>Study</b><span>University entrance qualification + programme-specific evidence.</span></div><span class="source">Configured rule</span></div><div class="ruleRow"><div class="ruleText"><b>Vocational Training</b><span>Education evidence + German B1 usually required for visa purposes + training target.</span></div><span class="source">Official guidance</span></div><div class="ruleRow"><div class="ruleText"><b>Employment</b><span>Qualification + role alignment + recognition/comparability route where applicable + evidence of relevant experience.</span></div><span class="source">Official guidance</span></div></div><div class="card"><h3>Evidence quality labels</h3><div class="ruleRow"><div class="ruleText"><b>Verified</b><span>Matched to a document or confirmed source.</span></div><span class="status verified">✓ Verified</span></div><div class="ruleRow"><div class="ruleText"><b>Applicant-provided</b><span>Claimed by applicant, not yet source-verified.</span></div><span class="status applicant">Applicant</span></div><div class="ruleRow"><div class="ruleText"><b>AI-generated</b><span>Summary or inference only; never treated as proof.</span></div><span class="status ai">AI</span></div><div class="ruleRow"><div class="ruleText"><b>Conflict</b><span>Different sources disagree and clarification is required.</span></div><span class="status blocked">Conflict</span></div></div></div><div class="card" style="margin-top:16px"><h3>Extra evidence register</h3><p class="muted">Add the supporting files for anything beyond the core qualification.</p><div class="grid"><div><b style="font-size:11px">Courses</b><table class="table" id="extra_courses"><tr><td colspan="4" class="muted">None added yet.</td></tr></table></div><div><b style="font-size:11px">Internships</b><table class="table" id="extra_internships"><tr><td colspan="4" class="muted">None added yet.</td></tr></table></div></div><div class="grid"><div><b style="font-size:11px">Projects</b><table class="table" id="extra_projects"><tr><td colspan="4" class="muted">None added yet.</td></tr></table></div><div><b style="font-size:11px">Certifications</b><table class="table" id="extra_certifications"><tr><td colspan="4" class="muted">None added yet.</td></tr></table></div></div><div class="grid"><div><b style="font-size:11px">Awards / achievements</b><table class="table" id="extra_awards"><tr><td colspan="4" class="muted">None added yet.</td></tr></table></div><div><b style="font-size:11px">Volunteering / leadership</b><table class="table" id="extra_volunteering"><tr><td colspan="4" class="muted">None added yet.</td></tr></table></div></div><div class="grid"><div class="card" style="box-shadow:none"><input id="extraLabel" placeholder="e.g. AWS Cloud Practitioner / Summer internship / GitHub project"><select id="extraKind" class="select" style="margin-top:8px"><option value="courses">Course</option><option value="internships">Internship</option><option value="projects">Project / portfolio</option><option value="certifications">Certification</option><option value="awards">Award / achievement</option><option value="volunteering">Volunteering / leadership</option></select><input id="extraSource" style="margin-top:8px" placeholder="e.g. Internship_Letter.pdf"><button class="secondary" style="margin-top:8px" onclick="addExtraFromUI()">Add extra evidence</button></div><div class="card" style="box-shadow:none"><b style="font-size:11px">Useful interview evidence</b><p class="muted">Course certificates, internship letters, project links, hackathon awards, publications, recommendation letters, language certificates and portfolio evidence can all strengthen the profile when relevant.</p></div></div></div><div class="bottom"><span>${docsAnalyzed?'Uploaded files are registered; unverified claims stay outside final qualification.':'Upload first, then verify critical evidence.'}</span><button class="primary" onclick="show('video')">Continue to video →</button></div>`;renderExtras()}
function addExtraFromUI(){const kind=document.getElementById('extraKind').value,label=document.getElementById('extraLabel').value.trim(),source=document.getElementById('extraSource').value.trim()||'Applicant upload pending';if(!label){alert('Add a title for the extra evidence.');return;}addExtra(kind,label,source);documents()}
function captureDocs(){const f=document.getElementById('docInput').files;uploadedDocs=[...uploadedDocs,...[...f].map(x=>x.name)];docsAnalyzed=true;documents()}
function video(){document.getElementById("content").innerHTML=`<div class="pageTitle"><span class="pill">03 · INTRODUCTION VIDEO</span><h2>Capture motivation and career goals.</h2><p>The PDF calls for useful information from a short applicant introduction video, including background, motivation and career goals.</p></div><div class="video"><div class="preview">${videoReady?'▶ Video processed for demo':'◉ Introduction video'}<div><h3>${videoReady?'Transcript available':'Upload / record a short introduction'}</h3><p style="color:#b9c2d3;font-size:11px">${videoReady?'Background: Computer Science graduate · Motivation: build a career in Germany · Goal: '+goal:'In production, speech-to-text extracts the transcript and the agent identifies background, motivation and career goals.'}</p><input id="videoInput" type="file" accept="video/*" style="font-size:10px"></div></div></div><div class="insights"><div class="insight"><small>Background</small><b>${videoReady?'Computer Science graduate with software engineering experience':'Not captured yet'}</b></div><div class="insight"><small>Motivation</small><b>${videoReady?'Interested in building a long-term career in Germany':'Not captured yet'}</b></div><div class="insight"><small>Career goal</small><b>${videoReady?goal:'Not captured yet'}</b></div><div class="insight"><small>Evidence label</small><b><span class="status ai">AI-generated summary</span> · source: video transcript</b></div><button class="primary" style="margin-top:12px" onclick="captureVideo()">${videoReady?'Refresh video analysis':'Analyze video'}</button></div></div><div class="bottom"><span>Video is supporting context; it does not replace mandatory documents.</span><button class="primary" onclick="show('qualification')">Run qualification →</button></div>`}
function captureVideo(){const f=document.getElementById('videoInput')?.files;videoUploaded=!!(f&&f.length);videoReady=true;show('video')}
function ruleStatus(rule){const ok=!!rule.state();return `<span class="status ${ok?'verified':'blocked'}">${ok?'✓ Meets':'Needs action'}</span>`}
function qualification(){const rules=standards[goal];const passed=rules.filter(r=>r.state()).length;const total=rules.length;const percent=Math.round((passed/total)*100);const criticalBlocked=rules.filter(r=>!r.state());const common=[
{id:'dates',label:'Employment dates / internship dates are internally consistent',detail:'Dates should match across CV, experience letters, internship letters and applicant profile.',source:'Evidence consistency',state:()=>employmentDatesConfirmed||goal==='Study'},
{id:'docs',label:'No unresolved mandatory document gap',detail:'Critical evidence must be available and verified before final routing.',source:'Evidence completeness',state:()=>criticalBlocked.length===0},
{id:'video',label:'Video context available (supporting, not mandatory)',detail:'Helpful context from the introduction video; it does not replace required evidence.',source:'Problem statement',state:()=>true}
];
const all=[...rules,...common];const hardBlocked=all.filter(r=>!r.state());qualified=qualificationRun && hardBlocked.length===0;evidenceResolved=hardBlocked.length===0;
if(!qualificationRun)qualificationStatus='BLOCKED'; else if(qualified)qualificationStatus='PASSED'; else if(hardBlocked.length<3)qualificationStatus='CONDITIONALLY READY'; else qualificationStatus='BLOCKED';
const decision=qualificationStatus==='PASSED'?'PASSED':qualificationStatus==='CONDITIONALLY READY'?'NEEDS EVIDENCE':'BLOCKED';
document.getElementById("content").innerHTML=`<div class="pageTitle"><span class="pill">04 · QUALIFICATION CHECK</span><h2>Pathway: ${goal}</h2><p>This is a pre-screening decision engine, not a legal or visa decision. Every requirement must have a reason and an evidence state.</p></div><div class="grid"><div class="card"><h3>Qualification gates</h3>${all.map(r=>`<div class="ruleRow"><div class="ruleText"><b>${r.label}</b><span>${r.detail}<br><em>Basis: ${r.source}</em></span></div>${ruleStatus(r)}</div>`).join('')}</div><div class="card score"><div class="scoreCircle">${percent}%</div><div class="metric">Configured pathway criteria currently met</div><h3 style="margin-top:16px">${decision}</h3><p class="muted">${qualified?'All configured hard gates pass.':'The applicant cannot proceed to the final resume stage until every hard gate is satisfied.'}</p></div></div><div class="card" style="margin-top:16px"><h3>Required confirmations</h3><label class="checkline"><input type="checkbox" ${employmentDatesConfirmed?'checked':''} onchange="employmentDatesConfirmed=this.checked;show('qualification')"> I confirm employment/internship dates against the supporting letters.</label><label class="checkline"><input type="checkbox" ${languageEvidenceVerified?'checked':''} onchange="languageEvidenceVerified=this.checked;coreDocs.find(x=>x.name==='German B1 Certificate').status=this.checked?'verified':'review';show('qualification')"> I have verified the required language evidence against the uploaded certificate (for pathways that require it).</label><label class="checkline"><input type="checkbox" ${languageRequirementChecked?'checked':''} onchange="languageRequirementChecked=this.checked;show('qualification')"> I have checked the language requirement for the target employment role and confirmed the required evidence is present or not required.</label><label class="checkline"><input type="checkbox" ${recognitionConfirmed?'checked':''} onchange="recognitionConfirmed=this.checked;show('qualification')"> I have addressed the recognition/comparability route applicable to this employment pathway.</label><label class="checkline"><input type="checkbox" ${programFitConfirmed?'checked':''} onchange="programFitConfirmed=this.checked;show('qualification')"> I have captured the programme/admission-fit check for the study pathway.</label><label class="checkline"><input type="checkbox" ${trainingOfferConfirmed?'checked':''} onchange="trainingOfferConfirmed=this.checked;show('qualification')"> I have defined the target Ausbildung profession / training route.</label><div class="bottom"><span>${qualificationRun?(qualified?'✓ All configured gates passed':'Some hard gates are still open — do not route to resume'):'Not evaluated yet'}</span><button class="primary" onclick="qualificationRun=true;show('qualification')">${qualificationRun?'Run qualification again':'Run qualification'}</button></div></div><div class="route2"><b>Why these checks?</b><p class="muted">Germany pathway rules differ. Study uses university-entrance / programme-fit evidence. Vocational training usually needs German B1 for visa purposes and may need school-leaving recognition. Employment may require recognition/licensing for regulated professions and comparability evidence for certain non-regulated routes and visa purposes. Extra courses, internships, projects and certifications enrich the profile but do not automatically make a blocked mandatory gate pass.</p><div style="margin-top:8px"><a href="https://www.make-it-in-germany.com/en/study-vocational-training/studies-in-germany/requirements" target="_blank">Study requirements</a> · <a href="https://www.make-it-in-germany.com/en/service/faq" target="_blank">Vocational training FAQ</a> · <a href="https://www.make-it-in-germany.com/en/working-in-germany/recognition/who-needs" target="_blank">Recognition rules</a></div></div><div class="bottom"><span>Qualification → ${qualified?'verified resume unlocked':'evidence completion required'}</span><button class="primary" onclick="show('next')">View next step →</button></div>`}
function next(){if(!qualificationRun||!qualified){document.getElementById('content').innerHTML=`<div class="pageTitle"><span class="pill">05 · NEXT-STEP ROUTER</span><h2>Do not skip the qualification gate.</h2><p>The correct next action is determined by the unresolved evidence—not by a generic resume workflow.</p></div><div class="route">⚠<small> ${qualificationStatus}</small><h2>Complete the remaining qualification evidence</h2><p>${goal==='Employment'?'Verify recognition/comparability, relevant experience, language evidence and consistency.':goal==='Vocational Training'?'Verify German B1 evidence, education evidence, the target training profession and document consistency.':'Verify university-entry qualification, programme fit and education evidence.'}</p></div><div class="actions"><div class="action"><b>1 · Complete evidence</b><p>Upload missing course, internship, education, recognition or language proof.</p></div><div class="action"><b>2 · Clarify conflicts</b><p>Resolve dates or factual differences between sources.</p></div><div class="action"><b>3 · Re-run qualification</b><p>Only a clean hard-gate result can unlock the resume.</p></div></div><div class="bottom"><span>Resume locked</span><button class="primary" onclick="show('qualification')">Resolve qualification →</button></div>`;return;}document.getElementById('content').innerHTML=`<div class="pageTitle"><span class="pill">05 · NEXT-STEP ROUTER</span><h2>Qualification passed — verified resume is next.</h2><p>The profile meets the configured hard gates for ${goal}. The next step is to generate and approve a resume that includes only supported evidence.</p></div><div class="route">✓<small> QUALIFICATION PASSED</small><h2>Generate the evidence-backed resume</h2><p>Courses, internships, projects, certificates and achievements will be included as separate evidence sections with source labels, rather than being mixed into the core qualification decision.</p></div><div class="bottom"><span>Hard gates passed ✓</span><button class="primary" onclick="show('resume')">Open verified resume →</button></div>`}
function resume(){if(!qualified){show('next');return;}const extrasTotal=Object.values(extras).reduce((a,b)=>a+b.length,0);document.getElementById('content').innerHTML=`<div class="pageTitle"><span class="pill">06 · VERIFIED RESUME</span><h2>Evidence-backed interview resume.</h2><p>The AI formats and summarizes evidence. It does not turn an applicant claim into a verified fact without a source.</p></div><div class="card"><div style="display:flex;justify-content:space-between;align-items:start"><div><h2 style="margin:0 0 5px">Aarav Sharma</h2><div class="muted">Software Engineer · Bengaluru, India · Target: Germany · Pathway: ${goal}</div></div><span class="status verified">✓ Evidence-backed</span></div><hr style="border:0;border-top:1px solid #edf0f4;margin:15px 0"><h3>Professional Summary</h3><p style="font-size:11px;line-height:1.6">Computer Science graduate with verified software engineering experience, evidence-backed skills and additional learning / project exposure relevant to ${goal.toLowerCase()} opportunities in Germany.</p><h3>Core verified profile</h3><div class="ruleRow"><div class="ruleText"><b>Education</b><span>B.E. Computer Science · 2025 · Degree / diploma</span></div><span class="status verified">Source verified</span></div><div class="ruleRow"><div class="ruleText"><b>Experience</b><span>Software Engineer · 1.5 years · Experience letter</span></div><span class="status verified">Source verified</span></div><div class="ruleRow"><div class="ruleText"><b>Language</b><span>German B1 + English C1</span></div><span class="status ${languageEvidenceVerified?'verified':'applicant'}">${languageEvidenceVerified?'✓ Verified':'Applicant'} </span></div><h3>Extra evidence</h3><p style="font-size:10px;color:#69758b">${extrasTotal?extrasTotal+' additional evidence item(s) will be included in the resume with their source labels.':'No extra evidence added yet — courses, internships, projects and certifications can strengthen the profile.'}</p><div class="miniGrid"><div class="miniStat"><b>${extras.courses.length}</b><span>Courses</span></div><div class="miniStat"><b>${extras.internships.length}</b><span>Internships</span></div><div class="miniStat"><b>${extras.certifications.length}</b><span>Certifications</span></div></div><h3>Evidence rule</h3><p style="font-size:10px;color:#69758b">Verified facts → resume. Applicant-provided facts → clearly labelled. AI summaries → clearly labelled. Conflicts → excluded until resolved.</p></div><div class="card" style="margin-top:16px"><h3>Interview readiness</h3><div class="miniGrid"><div class="miniStat"><b>${interviewReadinessScore()}%</b><span>Interview readiness signal</span></div><div class="miniStat"><b>${extras.internships.filter(x=>x.verified).length}</b><span>Verified internships</span></div><div class="miniStat"><b>${extras.projects.filter(x=>x.verified).length}</b><span>Verified projects</span></div></div><p class="muted">This is a preparation signal, not a hiring decision. It looks for supporting evidence such as practical exposure, projects, certifications, video context and language evidence.</p></div><div class="bottom"><span>✓ Qualification passed · ${extrasTotal} extra evidence item(s)</span><button class="primary" onclick="resumeReady=true;show('outreach')">Approve resume & route via Educaro →</button></div>`}
function outreach(){if(!resumeReady){show('resume');return;}const companies=[{name:'SAP',domain:'Enterprise Software',role:'Software Engineering'},{name:'Siemens',domain:'Technology & Engineering',role:'Software Engineering'},{name:'Bosch',domain:'Engineering & Mobility',role:'Software Engineering'}];document.getElementById('content').innerHTML=`<div class="pageTitle"><span class="pill">07 · EDUCARO OUTREACH</span><h2>Route the approved application through Educaro Deutschland GmbH.</h2><p>The applicant does not contact the company directly. The application is submitted to Educaro first, then routed to a suitable company.</p></div><div class="timeline"><div class="step active"><b>1 · Applicant</b><span>Approve profile + resume</span></div><div class="step ${outreachSent?'active':''}"><b>2 · Educaro</b><span>Receive and review</span></div><div class="step ${educaroForwarded?'active':''}"><b>3 · Company</b><span>Matched employer receives profile</span></div><div class="step ${interviewOffer?'active':''}"><b>4 · Interview</b><span>Reply → date/time → notify</span></div></div><div class="card"><h3>Educaro handoff</h3><p style="font-size:11px"><b>${goal}</b> · Germany · Software Engineering · React / TypeScript / Node.js</p><div class="progress"><span style="width:${educaroForwarded?100:(outreachSent?62:32)}%"></span></div><p class="muted">${educaroForwarded?'Educaro has forwarded the profile to matched companies.':outreachSent?'Application submitted to Educaro Deutschland GmbH for review and onward routing.':'Ready to send after applicant approval.'}</p></div><div style="margin-top:15px">${companies.map(c=>`<div class="company"><div class="companyTop"><div><b>${c.name}</b><div class="muted">${c.domain} · ${c.role}</div></div><span class="status ${educaroForwarded?'verified':'applicant'}">${educaroForwarded?'✓ Routed via Educaro':'Matched after Educaro review'}</span></div><p class="muted">${educaroForwarded?'Company receives the application through Educaro Deutschland GmbH.':'Company is a prototype match; real routing requires connected Educaro/company data.'}</p></div>`).join('')}</div><div class="emailBox"><b>Email destination: Educaro Deutschland GmbH</b><p>Subject: ${goal} application — Aarav Sharma</p><p>Hello Educaro Deutschland GmbH,<br><br>I am applying for a ${goal.toLowerCase()} opportunity in Germany. My verified profile, supporting evidence and interview-ready resume are attached. Please review my profile and route my application to suitable employers / training partners in your network.<br><br>Regards,<br>Aarav Sharma</p></div><div class="bottom"><span>${educaroForwarded?'✓ Educaro forwarded → company reply monitoring active':outreachSent?'✓ Sent to Educaro · awaiting onward routing':'Applicant approval required'}</span><div style="display:flex;gap:8px"><button class="primary" onclick="sendOutreach()">${outreachSent?(educaroForwarded?'Refresh routing':'Simulate Educaro review + forwarding →'):'Approve & send to Educaro'}</button>${educaroForwarded?'<button class="secondary" onclick="show(\'interviews\')">Monitor company replies →</button>':''}</div></div>`}
function sendOutreach(){if(!qualified){show('next');return;}if(!resumeReady){show('resume');return;}if(!outreachSent){outreachSent=true;educaroForwarded=false;interviewOffer=false;applicantNotified=false;show('outreach');return;}if(outreachSent&&!educaroForwarded){educaroForwarded=true;show('outreach');return;}show('interviews')}
function interviews(){if(!outreachSent||!educaroForwarded){document.getElementById('content').innerHTML=`<div class="pageTitle"><span class="pill">08 · INTERVIEW MONITOR</span><h2>Monitoring is locked until Educaro forwards the application.</h2><p>Company-response monitoring starts only after the Educaro handoff is complete.</p></div><div class="route">🔒<small> WAITING FOR EDUCARO ROUTING</small><h2>Complete the Educaro handoff first</h2><p>Applicant → Educaro Deutschland GmbH → suitable company → company reply → interview extraction.</p></div><div class="bottom"><span>Resume approved ✓ · Educaro forwarding required</span><button class="primary" onclick="show('outreach')">Go to Educaro outreach →</button></div>`;return;}document.getElementById('content').innerHTML=`<div class="pageTitle"><span class="pill">08 · INTERVIEW MONITOR</span><h2>${interviewOffer?'Interview offer received':'Waiting for company response'}</h2><p>Educaro has routed the application. In production, the connected company inbox parses replies for interview intent, date, time, timezone, location / meeting link and required documents.</p></div><div class="card"><h3>Live workflow</h3><div class="ruleRow"><div class="ruleText"><b>Route</b><span>Applicant → Educaro Deutschland GmbH → matched company</span></div><span class="status verified">✓ Routed</span></div><div class="ruleRow"><div class="ruleText"><b>Reply classification</b><span>${interviewOffer?'Interview invitation detected':'Listening for interview / rejection / follow-up'}</span></div><span class="status ${interviewOffer?'verified':'info'}">${interviewOffer?'✓ Interview':'Listening'}</span></div><div class="ruleRow"><div class="ruleText"><b>Interview details</b><span>${interviewOffer?'Software Engineer · 15 Oct 2026 · 11:00 CET · Online meeting':'Date/time will be extracted from the company reply.'}</span></div><span class="status ${interviewOffer?'verified':'applicant'}">${interviewOffer?'✓ Extracted':'Pending'}</span></div><div class="ruleRow"><div class="ruleText"><b>Applicant notification</b><span>${applicantNotified?'Interview details sent to applicant':'Notification created automatically after extraction.'}</span></div><span class="status ${applicantNotified?'verified':'applicant'}">${applicantNotified?'✓ Sent':'Pending'}</span></div></div><div class="agentDecision"><div class="brain">◷</div><div><b>${interviewOffer?'Interview offer detected':'Company response agent active'}</b><p>${interviewOffer?'The response was classified as an interview invitation, and the date/time was extracted for the applicant notification.':'Use the demo control to simulate a positive company reply. A real deployment would connect this stage to Educaro’s approved inbox / CRM integration.'}</p></div><button class="primary" onclick="simulateInterviewOffer()">${interviewOffer?'Send / refresh notification':'Simulate company interview offer'}</button></div><div class="bottom"><span>Educaro forwarded → company reply → interview extraction → notification</span><button class="secondary" onclick="show('outreach')">Back to outreach</button></div>`}
function simulateInterviewOffer(){if(!outreachSent||!educaroForwarded){show('outreach');return;}interviewOffer=true;applicantNotified=true;show('interviews')}
function init(){show('journey')}
init();
</script></body></html>
