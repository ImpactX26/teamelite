<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>EduGuide AI — Applicant Journey</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Segoe UI,sans-serif;background:#f5f7fb;color:#172033}.app{display:flex;min-height:100vh}.side{width:240px;background:#0b1222;color:#dce3f2;padding:22px 15px;display:flex;flex-direction:column}.logo{display:flex;gap:10px;align-items:center;padding:4px 10px 28px}.mark{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,#735cff,#28c5d9);display:grid;place-items:center;color:#fff}.logo b{display:block;color:#fff}.logo small{color:#8d98ad}.label{font-size:9px;letter-spacing:1.5px;color:#68748b;padding:8px 12px}.nav{border:0;background:transparent;color:#aeb9cc;padding:11px 12px;border-radius:10px;text-align:left;cursor:pointer;margin:2px 0}.nav.active,.nav:hover{background:#1b2540;color:#fff}.agent{margin-top:auto;background:#151e33;border:1px solid #2a3550;border-radius:14px;padding:14px;font-size:11px}.online{color:#55d5a3;font-size:10px}.top{height:82px;background:#fff;border-bottom:1px solid #e5e9f1;padding:16px 34px;display:flex;align-items:center;justify-content:space-between}.eyebrow{font-size:9px;letter-spacing:1.5px;font-weight:800;color:#7b8599}.top h1{font-size:20px;margin:5px 0}.avatar{width:36px;height:36px;border-radius:50%;background:#eeeaff;color:#604cda;display:grid;place-items:center;font-weight:800}.content{max-width:1220px;padding:30px 34px;margin:auto}.hero{background:linear-gradient(120deg,#11182d,#26365e);border-radius:20px;color:#fff;padding:30px;display:flex;justify-content:space-between;align-items:center}.pill{display:inline-block;background:#efedff;color:#5f4cdb;padding:7px 10px;border-radius:20px;font-size:9px;font-weight:800;letter-spacing:1px}.hero .pill{background:#30395b;color:#c1b8ff}.hero h2{font-size:32px;margin:14px 0 7px}.hero h2 span{color:#aaa0ff}.hero p{color:#b9c2d3;max-width:690px;line-height:1.6;font-size:13px}.ring{width:88px;height:88px;border-radius:50%;border:8px solid #6256b8;display:grid;place-items:center;font-size:20px;font-weight:800}.grid{display:grid;grid-template-columns:1fr 1fr;gap:17px;margin-top:18px}.card{background:#fff;border:1px solid #e4e8f0;border-radius:15px;padding:20px}.card h3{font-size:13px;margin:0 0 15px}.choices{display:grid;grid-template-columns:1fr 1fr;gap:9px}.choice{border:1px solid #e1e5ed;background:#fafbfe;border-radius:10px;padding:12px;text-align:left;cursor:pointer;font-size:11px}.choice.selected{border-color:#715eea;background:#f0eeff;color:#5141c5;font-weight:800}.select{width:100%;height:44px;border:1px solid #dfe4ed;border-radius:10px;padding:0 11px;background:#fff}.agentDecision{margin-top:17px;padding:15px;background:#f0f7ff;border:1px solid #d9eaff;border-radius:14px;display:flex;align-items:center;gap:14px}.brain{width:38px;height:38px;border-radius:11px;background:#e4eaff;display:grid;place-items:center;color:#5d55d5}.agentDecision div:nth-child(2){flex:1;font-size:11px}.agentDecision p{margin:4px 0;color:#69758b;line-height:1.45}.primary{background:#6352df;color:#fff;border:0;border-radius:9px;padding:10px 15px;cursor:pointer;font-size:11px;font-weight:800}.section{margin-top:28px}.section h3{font-size:16px;margin:0}.section p{font-size:11px;color:#8791a4}.caps{display:grid;grid-template-columns:repeat(5,1fr);gap:11px}.cap{background:#fff;border:1px solid #e4e8f0;border-radius:14px;padding:15px;min-height:175px;cursor:pointer;text-align:left}.cap:hover{box-shadow:0 8px 24px #17203314;transform:translateY(-2px)}.num{color:#9aa3b2;font-size:9px;font-weight:800}.icon{float:right;color:#6452df;font-size:20px}.cap b{display:block;margin-top:24px;font-size:12px}.cap p{font-size:10px;line-height:1.5;min-height:48px}.open{color:#5e4cd2;font-size:10px;font-weight:800}.pageTitle{margin-bottom:18px}.pageTitle h2{font-size:25px;margin:10px 0 5px}.pageTitle p{font-size:12px;color:#7c879a}.form{display:grid;grid-template-columns:1fr 1fr;gap:13px}.field label{display:block;font-size:10px;color:#7b8599;margin-bottom:6px}.field input{width:100%;height:38px;border:1px solid #e1e5ed;border-radius:8px;padding:0 10px;font-size:11px}.tags span{display:inline-block;padding:6px 9px;background:#efedff;color:#5e4bd3;border-radius:20px;font-size:10px;margin:3px}.upload{border:1px dashed #bcc6d8;border-radius:15px;background:#fbfcff;padding:28px;text-align:center}.upload b{display:block;margin:8px}.upload small{color:#8993a7}.docs{margin-top:15px}.doc{background:#fff;border:1px solid #e4e8f0;border-radius:12px;padding:13px;display:flex;align-items:center;gap:10px;margin-bottom:8px}.docText{flex:1}.docText b,.docText span{display:block}.docText b{font-size:11px}.docText span{font-size:9px;color:#8992a5;margin-top:3px}.ok{font-size:9px;color:#218d69;background:#ecfaf5;padding:6px 8px;border-radius:15px;font-weight:800}.video{display:grid;grid-template-columns:1.2fr .8fr;gap:16px}.preview{min-height:300px;background:linear-gradient(145deg,#11182b,#263354);color:#fff;border-radius:15px;display:grid;place-items:center;text-align:center}.insights{background:#fff;border:1px solid #e4e8f0;border-radius:15px;padding:20px}.insight{padding:13px 0;border-bottom:1px solid #edf0f4}.insight small,.insight b{display:block}.insight small{color:#8992a5}.insight b{font-size:11px;margin-top:4px}.qual{display:grid;grid-template-columns:1.5fr .7fr;gap:16px}.row{padding:13px 0;border-top:1px solid #edf0f4;display:flex;justify-content:space-between}.row:first-child{border-top:0}.row b,.row span{display:block}.row b{font-size:11px}.row span{font-size:9px;color:#8992a5;margin-top:3px}.warn{color:#a06b00;background:#fff7e5;padding:6px 8px;border-radius:15px;font-size:9px;font-weight:800}.score{text-align:center;display:grid;place-items:center}.scoreCircle{width:110px;height:110px;border-radius:50%;border:9px solid #e8e5ff;display:grid;place-items:center;color:#5e4bd3;font-size:28px;font-weight:900}.route{background:linear-gradient(120deg,#171d34,#2b3c67);color:#fff;border-radius:16px;padding:26px}.route h2{margin:7px 0;font-size:22px}.route p{color:#b9c2d3;font-size:11px}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:15px}.action{background:#fff;border:1px solid #e4e8f0;border-radius:13px;padding:17px}.action b{font-size:11px}.action p{font-size:10px;color:#818ba0;line-height:1.45}.status{display:inline-flex;align-items:center;gap:6px;font-size:9px;padding:6px 9px;border-radius:15px;font-weight:800}.verified{color:#218d69;background:#ecfaf5}.ai{color:#5e4bd3;background:#efedff}.applicant{color:#8b6200;background:#fff7e5}.emailBox{background:#f8f9fd;border:1px solid #e5e8f0;border-radius:12px;padding:14px;font-size:10px;line-height:1.55}.company{border:1px solid #e4e8f0;border-radius:12px;padding:14px;background:#fff;margin-bottom:10px}.companyTop{display:flex;justify-content:space-between;gap:10px}.companyTop b{font-size:11px}.muted{color:#8791a4;font-size:9px}.progress{height:8px;background:#edf0f5;border-radius:10px;overflow:hidden}.progress span{display:block;height:100%;background:#6352df;border-radius:10px}.bottom{display:flex;justify-content:space-between;align-items:center;margin-top:18px;color:#788398;font-size:10px}@media(max-width:900px){.side{display:none}.caps{grid-template-columns:repeat(2,1fr)}.video,.qual,.actions,.grid{grid-template-columns:1fr}.content{padding:20px}.hero{padding:22px}.ring{display:none}}
</style></head>
<body><div class="app">
<aside class="side"><div class="logo"><div class="mark">✦</div><div><b>EduGuide AI</b><small>Applicant Journey</small></div></div><div class="label">JOURNEY</div>
<button class="nav active" onclick="show('journey')">⌂ &nbsp; Journey</button><button class="nav" onclick="show('profile')">◉ &nbsp; Profile Builder</button><button class="nav" onclick="show('documents')">▣ &nbsp; Documents</button><button class="nav" onclick="show('video')">◉ &nbsp; Introduction Video</button><button class="nav" onclick="show('qualification')">✓ &nbsp; Qualification</button><button class="nav" onclick="show('next')">➜ &nbsp; Next Step</button><button class="nav" onclick="show('resume')">▤ &nbsp; Resume & Interview</button><button class="nav" onclick="show('outreach')">✉ &nbsp; Company Outreach</button><button class="nav" onclick="show('interviews')">◷ &nbsp; Interviews</button>
<div class="agent"><div class="online">● AGENT ONLINE</div><b>Journey Agent</b><p>Watching your profile and deciding what information is needed next.</p></div></aside>
<main><header class="top"><div><div class="eyebrow">AGENTIC AI TRACK · IMPACTX'26</div><h1 id="title">Your international career journey</h1></div><div class="avatar">AS</div></header><section class="content" id="content"></section></main></div>
<script>
const countries=["Germany"];let goal="Employment",country="Germany",videoReady=false;
const pages={journey,profile,documents,video,qualification,next,resume,outreach,interviews};let current="journey";
let uploadedDocs=[],videoUploaded=false,docsAnalyzed=false,resumeReady=false,outreachSent=false,educaroForwarded=false,interviewOffer=false,qualified=false,evidenceResolved=false;
let employmentDatesConfirmed=false,languageEvidenceVerified=false,qualificationRun=false;
const evidence=[{name:"Degree.pdf",type:"Education",status:"verified",fact:"B.E. Computer Science · 2025"},{name:"Experience Letter.pdf",type:"Employment",status:"verified",fact:"Software Engineer · 1.5 years"},{name:"CV.pdf",type:"Profile",status:"verified",fact:"React · TypeScript · Node.js"},{name:"German B1 Certificate.pdf",type:"Language",status:"review",fact:"Language evidence requires verification"}];
function show(p){current=p;document.querySelectorAll(".nav").forEach((x,i)=>x.classList.toggle("active",i===["journey","profile","documents","video","qualification","next","resume","outreach","interviews"].indexOf(p)));document.getElementById("title").textContent={journey:"Your international career journey",profile:"Build your applicant profile",documents:"Document intelligence",video:"Introduction video intelligence",qualification:"Qualification & evidence check",next:"Recommended next step",resume:"Verified resume & interview readiness",outreach:"Company outreach automation",interviews:"Interview offers & notifications"}[p];pages[p]();}
function journey(){document.getElementById("content").innerHTML=`<div class="hero"><div><span class="pill">✦ AI-GUIDED APPLICANT JOURNEY</span><h2>One profile. <span>Many pathways.</span></h2><p>Tell us your goal, destination and background. EduGuide AI collects evidence, detects gaps and routes you to the next action.</p></div><div class="ring">${qualified?100:90}%</div></div>
<div class="grid"><div class="card"><h3>1 · Choose your pathway</h3><div class="choices">${["Study","Internship","Employment","Vocational Training"].map(x=>`<button class="choice ${goal===x?"selected":""}" onclick="goal='${x}';journey()">${x==="Study"?"🎓":x==="Internship"?"🧑‍💻":x==="Employment"?"💼":"🛠️"} ${x}</button>`).join("")}</div></div><div class="card"><h3>2 · Destination</h3><div class="select" style="display:flex;align-items:center;font-weight:800;color:#5141c5">🇩🇪 Germany</div><p style="font-size:10px;color:#8992a5">This prototype is focused on the Germany applicant journey.</p></div></div>
<div class="agentDecision"><div class="brain">✦</div><div><b>Agent decision</b><p>For a <strong>${goal}</strong> journey to <strong>${country}</strong>, I'll check your profile and request only the evidence that is missing.</p></div><button class="primary" onclick="show('profile')">Start journey →</button></div>
<div class="section"><h3>Five AI capabilities</h3><p>All five work together as one applicant journey.</p><div class="caps">${cap("01","Profile Builder","Progressively structures education, experience, skills and goals.","◉","profile")}${cap("02","Document Intelligence","Extracts evidence from CVs, certificates and experience letters.","▣","documents")}${cap("03","Video Intelligence","Turns an introduction video into motivation and career signals.","◉","video")}${cap("04","Qualification Agent","Checks requirements and surfaces missing or inconsistent information.","✓","qualification")}${cap("05","Next-Step Router","Converts the qualification result into a clear action.","➜","next")}</div></div>`}
function cap(n,t,p,i,s){return `<button class="cap" onclick="show('${s}')"><span class="num">${n}</span><span class="icon">${i}</span><b>${t}</b><p>${p}</p><span class="open">Open →</span></button>`}
function profile(){document.getElementById("content").innerHTML=`<div class="pageTitle"><span class="pill">01 · PROFILE BUILDER</span><h2>Progressively build one trusted profile.</h2><p>Applicant-provided information is kept separate from evidence extracted from documents.</p></div><div class="grid"><div class="card"><h3>Applicant details</h3><div class="form">${field("Full name","Aarav Sharma")}${field("Current location","Bengaluru, India")}${field("Education","B.E. Computer Science")}${field("Graduation year","2025")}${field("Experience","1.5 years")}${field("Target country",country)}</div></div><div class="card"><h3>Journey target</h3><p style="font-size:11px"><b>Goal:</b> ${goal}</p><p style="font-size:11px"><b>Destination:</b> ${country}</p><p style="font-size:11px;color:#258f6b"><b>✓ Agent:</b> Profile sufficient for document check.</p></div></div><div class="card" style="margin-top:17px"><h3>Skills & languages</h3><div class="tags"><span>React</span><span>TypeScript</span><span>Node.js</span><span>PostgreSQL</span><span>English — C1</span><span>German — B1</span></div></div><div class="bottom"><span>Next: verify supporting documents</span><button class="primary" onclick="show('documents')">Continue →</button></div>`}
function field(l,v){return `<div class="field"><label>${l}</label><input value="${v}"></div>`}
function documents(){document.getElementById("content").innerHTML=`<div class="pageTitle"><span class="pill">02 · DOCUMENT INTELLIGENCE</span><h2>Process every interview-relevant document.</h2><p>Only evidence traceable to an uploaded source is used for the verified resume and outreach.</p></div><div class="upload"><b>＋ Upload applicant documents</b><small>PDF, DOCX, JPG · degrees · certificates · experience letters · CV</small><br><input id="docInput" type="file" multiple accept=".pdf,.doc,.docx,.jpg,.jpeg,.png" style="margin:12px 0;font-size:10px"><br><button class="primary" onclick="captureDocs()">Add & analyze documents</button></div><div class="docs">${evidence.map(x=>`<div class="doc"><div style="font-size:20px">▣</div><div class="docText"><b>${x.name}</b><span>${x.type} · ${x.fact}</span></div><span class="${x.status==='verified'?'status verified':'status applicant'}">${x.status==='verified'?'✓ Verified':'! Review'}</span></div>`).join("")}${uploadedDocs.map(x=>`<div class="doc"><div style="font-size:20px">▣</div><div class="docText"><b>${x}</b><span>Applicant upload · awaiting server-side extraction</span></div><span class="status applicant">Uploaded</span></div>`).join("")}</div><div class="agentDecision"><div class="brain">✦</div><div><b>Evidence agent</b><p>${docsAnalyzed?"All uploaded files are queued for extraction; unverified facts stay out of the final resume until confirmed.":"Upload all available documents first. The agent will identify missing, incomplete or inconsistent evidence."}</p></div><button class="primary" onclick="show('video')">Analyze introduction →</button></div>`}
function video(){document.getElementById("content").innerHTML=`<div class="pageTitle"><span class="pill">03 · VIDEO INTELLIGENCE</span><h2>Analyze the applicant introduction.</h2><p>The video agent extracts background, motivation and career goals, then keeps those signals separate from verified documents.</p></div><div class="video"><div class="preview"><div><div style="font-size:44px">▶</div><b>${videoUploaded?"Introduction video uploaded":"Upload introduction video"}</b><p style="color:#aeb8cb;font-size:10px">MP4/WebM · short applicant introduction</p><input id="videoInput" type="file" accept="video/*" style="font-size:10px;margin:10px"><br><button class="primary" onclick="captureVideo()">Process video</button></div></div><div class="insights"><h3>AI-extracted signals</h3>${ins("Background",videoUploaded?"Computer Science graduate with software experience":"Waiting for video")}${ins("Motivation",videoUploaded?"Wants international software experience":"Waiting for video")}${ins("Career goal",videoUploaded?"Software engineering role abroad":"Waiting for video")}</div></div><div class="bottom"><span class="status ai">AI-generated signals · confirm before treating as verified</span><button class="primary" onclick="show('qualification')">Run qualification →</button></div>`}
function ins(a,b){return `<div class="insight"><small>${a}</small><b>${b}</b></div>`}
function qualification(){
  const blockers=[];
  if(!employmentDatesConfirmed) blockers.push("Confirm employment dates against the experience letter");
  if(!languageEvidenceVerified) blockers.push("Verify or upload the required German language certificate");
  evidenceResolved=employmentDatesConfirmed && languageEvidenceVerified;
  const ready=qualificationRun && evidenceResolved && qualified;
  const stateTitle=ready?"Qualification passed":"Qualification blocked";
  const stateText=ready?"All required evidence is verified and the applicant can move to the resume stage.":"Required evidence is still unresolved. The resume and outreach stages remain locked.";
  const rows=[
    ["Education","B.E. Computer Science",true],
    ["Relevant experience","1.5 years",true],
    ["Technical skills","React · TypeScript · Node.js",true],
    ["Target destination",country,true],
    ["Language evidence",languageEvidenceVerified?"German B1 · certificate verified":"German B1 · certificate requires verification",languageEvidenceVerified],
    ["Experience dates",employmentDatesConfirmed?"Confirmed against experience letter":"CV and experience letter require confirmation",employmentDatesConfirmed]
  ];
  document.getElementById("content").innerHTML=`
  <div class="pageTitle"><span class="pill">04 · QUALIFICATION AGENT</span><h2>Evidence in. Qualification out.</h2><p>The qualification result controls the next stage. Nothing is marked qualified until every required blocker is explicitly resolved.</p></div>
  <div class="qual"><div class="card"><h3>${goal} → ${country}</h3>${rows.map(x=>`<div class="row"><div><b>${x[0]}</b><span>${x[1]}</span></div><span class="${x[2]?"ok":"warn"}">${x[2]?"✓ Pass":"! Required"}</span></div>`).join("")}</div>
  <div class="card score"><div class="scoreCircle">${ready?"100":"—"}</div><h3>${stateTitle}</h3><p style="font-size:10px;color:#818ba0">${stateText}</p><button class="primary" onclick="runQualification()">${ready?"Qualification complete":"Run qualification"}</button></div></div>
  <div class="card" style="margin-top:16px"><h3>Resolve required evidence</h3>
    <label style="display:flex;gap:10px;align-items:flex-start;padding:12px 0;border-bottom:1px solid #edf0f4;font-size:11px;cursor:pointer"><input type="checkbox" ${employmentDatesConfirmed?"checked":""} onchange="employmentDatesConfirmed=this.checked;qualified=false;qualificationRun=false;qualification()"><span><b>Employment dates confirmed</b><br><span class="muted">Confirm that the CV dates match the Experience Letter.</span></span></label>
    <label style="display:flex;gap:10px;align-items:flex-start;padding:12px 0;font-size:11px;cursor:pointer"><input type="checkbox" ${languageEvidenceVerified?"checked":""} onchange="languageEvidenceVerified=this.checked;qualified=false;qualificationRun=false;qualification()"><span><b>Language evidence verified</b><br><span class="muted">Confirm the German B1 certificate is valid and belongs to the applicant.</span></span></label>
  </div>
  <div class="agentDecision"><div class="brain">${ready?"✓":"!"}</div><div><b>${ready?"Qualification passed":"Agent found unresolved evidence"}</b><p>${ready?"All required checks passed. The next step is the evidence-backed resume.":blockers.length?blockers.join(" · ")+". Resolve these blockers, then run qualification again.":"All blockers are selected. Run qualification to commit the result."}</p></div><button class="primary" onclick="${ready?"show('next')":"runQualification()"}">${ready?"Continue to next step →":"Check qualification"}</button></div>
  <div class="bottom"><span>${ready?"✓ Qualification complete · Resume unlocked":"🔒 Resume locked until qualification passes"}</span><button class="primary" onclick="show('next')">View next step →</button></div>`;
}
function runQualification(){
  qualificationRun=true;
  evidenceResolved=employmentDatesConfirmed && languageEvidenceVerified;
  qualified=evidenceResolved;
  if(qualified){
    resumeReady=false;
    outreachSent=false;
    interviewOffer=false;
    educaroForwarded=false;
  }
  qualification();
}
function resolveEvidence(){
  show('qualification');
}

function act(n,t,p){return `<div class="action"><b>${n} · ${t}</b><p>${p}</p></div>`}
function captureDocs(){const f=document.getElementById("docInput").files;uploadedDocs=[...f].map(x=>x.name);docsAnalyzed=true;documents();}
function captureVideo(){videoUploaded=true;videoReady=true;video();}
function next(){
  if(!qualificationRun || !qualified || !evidenceResolved){
    document.getElementById("content").innerHTML=`<div class="pageTitle"><span class="pill">05 · NEXT-STEP ROUTER</span><h2>Complete qualification evidence first.</h2><p>The next step is controlled by the qualification result. Resume generation and company outreach stay locked until qualification passes.</p></div><div class="route">⚠<small> QUALIFICATION BLOCKED</small><h2>Resolve outstanding evidence</h2><p>Confirm employment dates and verify the required language certificate, then run qualification again.</p></div><div class="bottom"><span>Resume locked until qualification passes</span><button class="primary" onclick="show('qualification')">Resolve evidence →</button></div>`;
    return;
  }
  document.getElementById("content").innerHTML=`<div class="pageTitle"><span class="pill">05 · NEXT-STEP ROUTER</span><h2>Qualification passed — resume is the next action.</h2><p>The applicant has satisfied the required qualification checks. The workflow now routes to the evidence-backed resume before company outreach.</p></div><div class="route">✓<small> QUALIFICATION PASSED</small><h2>Generate and approve the verified resume</h2><p>Only verified applicant evidence is carried into the resume. Company outreach remains locked until the resume is approved.</p></div><div class="bottom"><span>Qualification ✓ · Evidence resolved ✓ · Resume ready for generation</span><button class="primary" onclick="show('resume')">Open verified resume →</button></div>`;
}
function resume(){if(!qualified || !evidenceResolved || !qualificationRun){show('next');return;}document.getElementById("content").innerHTML=`<div class="pageTitle"><span class="pill">06 · VERIFIED RESUME</span><h2>Interview-ready resume built from evidence.</h2><p>Facts below are sourced from verified applicant documents. AI formats and summarizes but does not invent credentials.</p></div><div class="card"><div style="display:flex;justify-content:space-between;align-items:start"><div><h2 style="margin:0 0 5px">Aarav Sharma</h2><div class="muted">Software Engineer · Bengaluru, India · Target: ${country}</div></div><span class="status verified">✓ Evidence-backed</span></div><hr style="border:0;border-top:1px solid #edf0f4;margin:15px 0"><h3>Professional Summary</h3><p style="font-size:11px;line-height:1.6">Computer Science graduate with verified software engineering experience and skills in React, TypeScript and Node.js, seeking a ${goal.toLowerCase()} opportunity in ${country}.</p><h3>Verified Experience</h3><div class="row"><div><b>Software Engineer</b><span>1.5 years · Experience Letter.pdf</span></div><span class="status verified">Source verified</span></div><h3>Verified Education & Skills</h3><p style="font-size:11px">B.E. Computer Science · 2025 · React · TypeScript · Node.js</p><h3>Language</h3><p style="font-size:11px">German B1 · <span class="status verified">certificate verified</span></p></div><div class="bottom"><span>✓ Qualification passed · evidence sources locked · no unsupported facts added</span><button class="primary" onclick="resumeReady=true;show('outreach')">Approve resume & find companies →</button></div>`}
function outreach(){if(!resumeReady){show('resume');return;}const companies=[{name:"SAP",domain:"Enterprise Software",role:"Software Engineering"},{name:"Siemens",domain:"Technology & Engineering",role:"Software Engineering"},{name:"Bosch",domain:"Engineering & Mobility",role:"Software Engineering"}];document.getElementById("content").innerHTML=`<div class="pageTitle"><span class="pill">07 · COMPANY OUTREACH</span><h2>Route the application through Educaro.</h2><p>The applicant does not contact the company directly. The approved application is first sent to <b>Educaro Deutschland GmbH</b>, which then forwards it to the matched company.</p></div><div class="card"><h3>Target profile</h3><p style="font-size:11px"><b>${goal}</b> · Germany · Software Engineering · React / TypeScript / Node.js</p><div class="progress"><span style="width:${educaroForwarded?100:(outreachSent?70:45)}%"></span></div><p class="muted">${educaroForwarded?"Educaro has forwarded the application to the matched company.":outreachSent?"Application submitted to Educaro Deutschland GmbH for onward routing.":"Resume approved. Ready to submit the application to Educaro."}</p></div><div style="margin-top:15px">${companies.map(c=>`<div class="company"><div class="companyTop"><div><b>${c.name}</b><div class="muted">${c.domain} · ${c.role}</div></div><span class="status ${educaroForwarded?'verified':'applicant'}">${educaroForwarded?'✓ Forwarded via Educaro':'Educaro route'}</span></div><p class="muted">${educaroForwarded?'Company receives the application through Educaro Deutschland GmbH.':'Company outreach remains routed through Educaro Deutschland GmbH.'}</p></div>`).join("")}</div><div class="emailBox"><b>Email to Educaro Deutschland GmbH</b><p>Subject: Software Engineer application — Aarav Sharma</p><p>Hello Educaro Deutschland GmbH,<br><br>I am applying for a Software Engineering opportunity in Germany. My verified profile and evidence-backed resume are attached. Please review my profile and forward my application to suitable companies in your network for relevant openings.<br><br>Regards,<br>Aarav Sharma</p></div><div class="bottom"><span>${educaroForwarded?'✓ Educaro forwarded the application → company reply monitoring is active':outreachSent?'✓ Sent to Educaro Deutschland GmbH · awaiting onward forwarding':'Applicant approval required before sending to Educaro'}</span><div style="display:flex;gap:8px"><button class="primary" onclick="sendOutreach()">${outreachSent?(educaroForwarded?'Refresh status':'Simulate Educaro forwarding →'):'Approve & send to Educaro'}</button>${educaroForwarded?'<button class="primary" onclick="show(\'interviews\')">Monitor company replies →</button>':''}</div></div>`}
function sendOutreach(){
  if(!qualified || !evidenceResolved || !qualificationRun){show('qualification');return;}
  if(!resumeReady){show('resume');return;}
  if(!outreachSent){outreachSent=true;educaroForwarded=false;interviewOffer=false;show('outreach');return;}
  if(outreachSent && !educaroForwarded){educaroForwarded=true;show('outreach');return;}
  show('interviews');
}
function interviews(){
  if(!outreachSent || !educaroForwarded){
    document.getElementById("content").innerHTML=`<div class="pageTitle"><span class="pill">08 · INTERVIEW MONITOR</span><h2>Interview monitoring is locked until Educaro forwards the application.</h2><p>The journey must complete qualification, resume approval, submission to Educaro Deutschland GmbH, and onward forwarding to the matched company before incoming company replies can be monitored.</p></div><div class="route">🔒<small> WAITING FOR EDUCARO ROUTING</small><h2>Complete the Educaro handoff first</h2><p>The approved application is sent to Educaro Deutschland GmbH first. After Educaro forwards it to a matched company, this stage becomes active and can process an interview invitation and its date/time.</p></div><div class="bottom"><span>Qualification ✓ · Resume approved ✓ · Educaro forwarding required</span><button class="primary" onclick="show('outreach')">Go to company outreach →</button></div>`;
    return;
  }
  document.getElementById("content").innerHTML=`<div class="pageTitle"><span class="pill">08 · INTERVIEW MONITOR</span><h2>${interviewOffer?'Interview offer received':'Waiting for company response'}</h2><p>Educaro has forwarded the application to the matched company. The interview agent now monitors the company response, extracts interview details, and notifies the applicant.</p></div><div class="card"><h3>Live workflow</h3><div class="row"><div><b>Application route</b><span>Applicant → Educaro Deutschland GmbH → matched company</span></div><span class="status verified">✓ Routed</span></div><div class="row"><div><b>Company reply monitoring</b><span>Interview intent + date/time extraction</span></div><span class="status verified">✓ Listening</span></div><div class="row"><div><b>Interview offer</b><span>${interviewOffer?'Software Engineer · 15 Oct 2026 · 11:00 CET':'No interview offer detected yet'}</span></div><span class="status ${interviewOffer?'verified':'applicant'}">${interviewOffer?'✓ Detected':'Waiting'}</span></div><div class="row"><div><b>Applicant notification</b><span>${interviewOffer?'Interview details sent to applicant':'Notification will be sent automatically after an offer is detected'}</span></div><span class="status ${interviewOffer?'verified':'applicant'}">${interviewOffer?'✓ Sent':'Pending'}</span></div></div><div class="agentDecision"><div class="brain">◷</div><div><b>${interviewOffer?'Interview offer detected — journey routed to interview':'Company response agent active'}</b><p>${interviewOffer?'The company response was classified as an interview invitation. The system extracted the date/time and created the applicant notification.':'Educaro has forwarded the application. In production, the connected inbox monitors the company response. Use the simulation below to demonstrate the complete loop.'}</p></div><button class="primary" onclick="simulateInterviewOffer()">${interviewOffer?'Refresh notification':'Simulate company interview offer'}</button></div><div class="bottom"><span>Educaro forwarded → company reply → interview extraction → notification</span><button class="primary" onclick="show('outreach')">Back to outreach</button></div>`;
}
function simulateInterviewOffer(){
  if(!outreachSent || !educaroForwarded){show('outreach');return;}
  interviewOffer=true;
  show('interviews');

}
show("journey");
</script></body></html>
